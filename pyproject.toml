[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "smk-platform"
version = "0.1.0"
description = "SM Kelponaukenclaw Platform - Technical Infrastructure Foundation"
authors = [{name = "SM Kelponaukenclaw", email = "founder@kelponaukenclaw.com"}]
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
